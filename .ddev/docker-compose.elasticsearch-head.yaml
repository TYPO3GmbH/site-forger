version: '3.6'
services:
  elasticsearch-head:
    image: 'mobz/elasticsearch-head:5'
    container_name: ddev-${DDEV_SITENAME}-elasticsearch-head
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
    environment:
    - VIRTUAL_HOST=$DDEV_HOSTNAME
    - HTTP_EXPOSE=9100
    ports:
    - 9100
    networks:
    - default
  web:
    links:
    - elasticsearch-head:$DDEV_HOSTNAME
networks:
  default:
    external:
      name: ddev_default

