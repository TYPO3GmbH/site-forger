version: '3.6'

services:
  keycloak-gatekeeper:
    container_name: ddev-${DDEV_SITENAME}-gatekeeper
    image: bitnami/keycloak-gatekeeper-archived:10-scratch
    ports:
      - '3009:3009'
    volumes:
      - type: "bind"
        source: "."
        target: "/mnt/ddev_config"
    command:
      - /keycloak-gatekeeper
      - "--config=/mnt/ddev_config/keycloak-gatekeeper.conf"
