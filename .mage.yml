magephp:
  log_dir: ./.mage/logs
  composer:
    path: composer
  exclude:
    - ./.ddev
    - ./.editorconfig
    - ./.git
    - ./.github
    - ./.mage
    - ./assets
    - ./build
    - ./node_modules
    - ./var
    - ./.env.local
    - ./.gitattributes
    - ./.gitignore
    - ./.mage.yml
    - ./.vscode
    - ./LICENSE
    - ./README.md
    - ./auth.json
    - ./package-lock.json
    - ./package.json
    - ./phpunit.xml.dist
    - ./symfony.lock
    - ./webpack.config.js
  environments:
    master:
      user: forger.typo3.com
      from: ./
      host_path: /srv/vhosts/forger.typo3.com/site/mage/
      releases: 3
      hosts:
        - 188.34.182.186
      pre-deploy:
        - exec: { cmd: "echo \"APP_ENV=prod\" >> .env.local"}
        - exec: { cmd: "composer install --no-interaction --no-dev --no-progress --optimize-autoloader"}
        - exec: { cmd: "npm ci"}
        - exec: { cmd: "npm run build"}
      on-deploy:
        - fs/link: { from: "../../../shared/var", to: "var" }
        - fs/link: { from: "../../../shared/.env.local", to: ".env.local" }
      on-release:
      post-release:
        - exec: { cmd: "[ -d ../../../cachetool ] || mkdir -p ../../../cachetool" }
        - exec: { cmd: "[ -f ../../../cachetool/cachetool-9.1.0.phar ] || curl -L -o ../../../cachetool/cachetool-9.1.0.phar https://gordalina.github.io/cachetool/downloads/cachetool-9.1.0.phar && chmod +x ../../../cachetool/cachetool-9.1.0.phar" }
        - exec: { cmd: "php ../../../cachetool/cachetool-9.1.0.phar opcache:reset --fcgi=/var/run/forger.typo3.com_fpm.sock --tmp-dir=/srv/vhosts/forger.typo3.com/site/cachetool" }
        - exec: { cmd: "/usr/bin/php8.3 /usr/bin/composer dump-env prod" }
        - exec: { cmd: "rm -rf var/cache"}
        - exec: { cmd: "/usr/bin/php8.3 ./bin/console doctrine:migrations:migrate --no-interaction"}
        - exec: { cmd: "/usr/bin/php8.3 ./bin/console cache:warmup"}
      post-deploy:

    develop:
      user: stage.forger.typo3.com
      from: ./
      host_path: /srv/vhosts/stage.forger.typo3.com/site/mage/
      releases: 3
      hosts:
        - 188.34.182.186
      pre-deploy:
        - exec: { cmd: "echo \"APP_ENV=prod\" >> .env.local"}
        - exec: { cmd: "composer install --no-interaction --no-dev --no-progress --optimize-autoloader"}
        - exec: { cmd: "npm ci"}
        - exec: { cmd: "npm run build"}
      on-deploy:
        - fs/link: { from: "../../../shared/var", to: "var" }
        - fs/link: { from: "../../../shared/.env.local", to: ".env.local" }
      on-release:
      post-release:
        - exec: { cmd: "[ -d ../../../cachetool ] || mkdir -p ../../../cachetool" }
        - exec: { cmd: "[ -f ../../../cachetool/cachetool-9.1.0.phar ] || curl -L -o ../../../cachetool/cachetool-9.1.0.phar https://gordalina.github.io/cachetool/downloads/cachetool-9.1.0.phar && chmod +x ../../../cachetool/cachetool-9.1.0.phar" }
        - exec: { cmd: "php ../../../cachetool/cachetool-9.1.0.phar opcache:reset --fcgi=/var/run/stage.forger.typo3.com_fpm.sock --tmp-dir=/srv/vhosts/stage.forger.typo3.com/site/cachetool" }
        - exec: { cmd: "/usr/bin/php8.3 /usr/bin/composer dump-env prod" }
        - exec: { cmd: "rm -rf var/cache"}
        - exec: { cmd: "/usr/bin/php8.3 ./bin/console doctrine:migrations:migrate --no-interaction"}
        - exec: { cmd: "/usr/bin/php8.3 ./bin/console cache:warmup"}
