name: Check out
inputs:
  token:
    description: Token for the checkout; falls back to the workflow token (e.g. for fork pull requests without secrets)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        repository: TYPO3GmbH/infra-github-actions
        ref: main
        path: ./.github/actions/t3g
        token: ${{ inputs.token || github.token }}
