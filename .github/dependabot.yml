version: 2
updates:

  - package-ecosystem: "npm"
    versioning-strategy: lockfile-only
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "[DEP]"
      prefix-development: "[DEP-DEV]"

  - package-ecosystem: "composer"
    versioning-strategy: lockfile-only
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "[DEP]"
      prefix-development: "[DEP-DEV]"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "[DEP]"
