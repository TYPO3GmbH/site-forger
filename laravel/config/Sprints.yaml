'T3G':
  'Forger':
    'Boards':
      'CodeSprint':
        'Name': Code Sprints
        'Query':
          'bool':
            'must':
              - 'term': {'focus.name': On Location Sprint}
            'must_not':
              'bool':
                must:
                  - range: {'updated_on': {'lte': 'now-30d'}}
                'should':
                  - 'term': {'status.name': Closed}
                  - 'term': {'status.name': Resolved}
                  - 'term': {'status.name': Rejected}
