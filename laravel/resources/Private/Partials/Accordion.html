<div class="panel-group" id="accordion" role="tablist" aria-multiselectable="true" style="margin-top: 20px;">
    <f:for each="{aggregations}" as="buckets" key="title">
        <frg:counter increase="1" />
        <div class="panel panel-default">
            <div class="panel-heading" role="tab" id="heading{frg:counter(output: 1)}">
                <h4 class="panel-title">
                    <a data-toggle="collapse" data-parent="#accordion" href="#collapse{frg:counter(output: 1)}" aria-expanded="true" aria-controls="collapse{frg:counter(output: 1)}" style="display:block;">
                        {title} <frg:bucketCounter category="{title}" buckets="{buckets.buckets}" />
                    </a>
                </h4>
            </div>
            <div id="collapse{frg:counter(output: 1)}" class="panel-collapse collapse {f:if(condition: '{frg:counter(output: 1)} == 1', then: 'in')}" role="tabpanel" aria-labelledby="heading{frg:counter(output: 1)}">
                <div class="panel-body">
	                <f:for each="{buckets.buckets}" as="bucket" key="index">
	                    <f:if condition="{bucket.doc_count} > 0">
	                        <div class="checkbox">
	                            <frg:aggregationBucket category="{title}" index="{index}" label="{f:if(condition: '{bucket.key_as_string} != \'\'', then: '{bucket.key_as_string}', else: '{bucket.key}' )}" bucket="{bucket.key}" docCount="{bucket.doc_count}" />
	                        </div>
	                    </f:if>
	                </f:for>
                </div>
            </div>
        </div>
    </f:for>
</div>
