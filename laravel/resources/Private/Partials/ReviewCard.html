<div class="card card-status-{card.negative_reviews}" id="review-{card.id}" data-issuenumber="{card._redmine_issue_id}">
    <f:if condition="{mode} == 'backport'">
        <f:then>
            <f:if condition="{card.reviewstatus}">
                <f:then></f:then>
                <f:else><div class="ribbon ribbonOrange" data-ribbon="MISSING"></div></f:else>
            </f:if>
            <f:switch expression="{card.reviewstatus}">
                <f:case value="MERGED"><div class="ribbon ribbonGreen" data-ribbon="MERGED"></div></f:case>
                <f:case value="ABANDONED"><div class="ribbon ribbonBlue" data-ribbon="ABANDONED"></div></f:case>
            </f:switch>
        </f:then>
        <f:else>
            <f:switch expression="{card.branch}">
                <f:case value="TYPO3_6-2"><div class="ribbon ribbonOrange" data-ribbon="6.2"></div></f:case>
                <f:case value="TYPO3_7-6"><div class="ribbon ribbonOrange" data-ribbon="7.6"></div></f:case>
                <f:case value="TYPO3_8-7"><div class="ribbon ribbonBlue" data-ribbon="8.7"></div></f:case>
            </f:switch>
        </f:else>
    </f:if>
    <div class="card-heading" {f:if(condition: card.reviewstatus, then:'', else:'style="opacity: 0.3"')}>
        <div class="media">
            <div class="media-body">
                <a href="https://review.typo3.org/#/c/{card.id}/" target="_blank">{card.subject}</a>
            </div>
            <div class="media-right">
                <f:if condition="{card.avatar}">
                    <f:render partial="Avatar" arguments="{username: card.avatar.username}" />
                </f:if>
            </div>
        </div>
    </div>
    <f:if condition="{0: card.mergeable} == {0: 'no'}">
        <div class="card-status">
            <span class="label label-danger">CAN'T MERGE</span>
        </div>
    </f:if>
    <div class="card-body"  {f:if(condition: card.reviewstatus, then:'', else:'style="opacity: 0.3"')}>
        <div class="row">
            <div class="col-sm-12">
                <i class="fa fa-user"></i> {card.owner} <span class="pull-right"><time is="time-ago" datetime="{card.updated_on}">{card.updated_on}</time></span>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">Files: <span class="label label-default pull-right">{card.affected_files}</span></div>
            <div class="col-md-6">Patches: <span class="label label-default pull-right">{card.patchsets}</span></div>
        </div>
        <div class="row status">
            <div class="col-md-6">Review:
                <f:if condition="{card.positive_reviews}">
                    <span class="label label-success pull-right"><i class="fa fa-check fa-fw"></i></span>
                </f:if>
                <f:if condition="{card.negative_reviews}">
                    <f:if condition="{0: card.negative_reviews} == {0: '2'}">
                        <f:then>
                            <span class="label label-danger pull-right"><i class="fa fa-times fa-fw"></i></span>
                        </f:then>
                        <f:else>
                            <span class="label label-danger pull-right"><i class="fa fa-minus fa-fw"></i></span>
                        </f:else>
                    </f:if>
                </f:if>
            </div>
            <div class="col-md-6">Tested:
                <f:if condition="{card.positive_verifications}">
                    <span class="label label-success pull-right"><i class="fa fa-check fa-fw"></i></span>
                </f:if>
                <f:if condition="{card.negative_verifications}">
                    <f:if condition="{0: card.negative_reviews} == {0: '2'}">
                        <f:then>
                            <span class="label label-danger pull-right"><i class="fa fa-times fa-fw"></i></span>
                        </f:then>
                        <f:else>
                            <span class="label label-danger pull-right"><i class="fa fa-minus fa-fw"></i></span>
                        </f:else>
                    </f:if>
                </f:if>
            </div>
        </div>
    </div>
</div>
