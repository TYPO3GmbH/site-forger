<f:layout name="Default"/>

<f:section name="Title">Dashboard</f:section>
<f:section name="Javascripts">
	<script type="text/javascript" src="/js/amcharts/amcharts.js"></script>
	<script type="text/javascript" src="/js/amcharts/serial.js"></script>
	<script type="text/javascript" src="/js/amcharts/pie.js"></script>
	<script type="text/javascript" src="/js/amcharts/plugins/dataloader/dataloader.min.js"></script>
</f:section>

<f:section name="Content">
	<div class="row">
		<div class="col-sm-12">
			<form action="/search" method="get" class="">
				<f:render partial="SearchBox" arguments="{query: query}"/>
			</form>
		</div>
		<div class="col-lg-4 col-sm-12">
			<div id="general" class="graph">
				<div class="row">
					<div class="col-sm-7 column"><h3>Open Issues:</h3></div>
					<div class="col-sm-5 column"><h1>{openIssues.total}</h1></div>
				</div>
				<div class="row">
					<div class="col-sm-7 column"><h3>Open Reviews:</h3></div>
					<div class="col-sm-5 column"><h1><fl:link.action controller="gerrit" action="status">{openReviews.total}</fl:link.action></h1>
					</div>
				</div>
				<div class="row">
					<div class="col-sm-12 column">
						<div id="mergeable" data-type="Gerrit" data-graph="Mergeable" data-chart="Pie" data-charttitle="Reviews mergeable?" class="graph" style="height: 300px;"></div>
					</div>
				</div>
			</div>
		</div>
		<div class="col-lg-4 col-sm-12">
			<div id="reviewOverTime" data-type="Gerrit" data-graph="OpenReviews" data-chart="Line" data-charttitle="Open Reviews" data-graphs="{graphConfig.Gerrit.OpenReviews->frg:format.json()}" class="graph"></div>
		</div>
		<div class="col-lg-4 col-sm-12">
			<div id="closedLastTwoMonths" data-type="Forge" data-graph="OpenVsClosed" data-chart="Line" data-charttitle="Opened vs. Closed" data-graphs="{graphConfig.Forge.OpenVsClosed->frg:format.json()}" class="graph"></div>
		</div>
		<div class="col-lg-6 col-sm-12">
			<div id="forgeDiff" data-type="Forge" data-graph="Burndown" data-chart="Line" data-charttitle="Open Tickets over time" data-graphs="{graphConfig.Forge.Burndown->frg:format.json()}" class="graph"></div>
		</div>
		<div class="col-lg-6 col-sm-12">
			<div id="gerritDiff" data-type="Gerrit" data-graph="Burndown" data-chart="Line" data-charttitle="Open Reviews over time" data-graphs="{graphConfig.Gerrit.Burndown->frg:format.json()}" class="graph"></div>
		</div>
		<div class="col-lg-12 col-sm-12">
			<div id="gerritOpenVsClosed" data-type="Gerrit" data-graph="Overview" data-chart="Overview" data-charttitle="Gerrit Overview" class="graph"></div>
		</div>
		<div class="container-fluid">
			<div class="col-lg-4 col-sm-12">
				<div id="gerritVelocity" data-type="Gerrit" data-graph="Velocity" data-chart="Velocity" data-charttitle="Gerrit Velocity" data-graphs="{graphConfig.Generic.Velocity->frg:format.json()}" class="graph"></div>
			</div>
			<div class="col-lg-4 col-sm-12">
				<div id="openvsclosed" data-type="Forge" data-graph="Velocity" data-chart="Velocity" data-charttitle="Forge Velocity" data-graphs="{graphConfig.Generic.Velocity->frg:format.json()}" class="graph"></div>
			</div>
			<div class="col-lg-4 col-sm-12">
				<div id="trackertype" data-type="Forge" data-graph="TrackerTypes" data-chart="BarHorizontal" data-charttitle="Tracker Types" data-graphs="{graphConfig.Forge.TrackerTypes->frg:format.json()}" class="graph"></div>
			</div>
		</div>
		<div class="col-lg-6">
			<div id="periodGerrit" data-type="Gerrit" data-graph="Period" data-chart="Line" data-charttitle="Review Progress Comparison" data-graphs="{graphConfig.Generic.Period->frg:format.json()}" class="graph"></div>
		</div>
		<div class="col-lg-6">
			<div id="periodTickets" data-type="Forge" data-graph="Period" data-chart="Line" data-charttitle="Ticket Progress Comparison" data-graphs="{graphConfig.Generic.Period->frg:format.json()}" class="graph"></div>
		</div>
	</div>
</f:section>
