<f:layout name="Default" />

<f:section name="Title">Stale tickets due to abandoned reviews</f:section>
<f:section name="Javascripts">
</f:section>

<f:section name="Content">
    <form action="/gerrit/stale-issues" method="get">
        <f:render partial="ReviewView" arguments="{
            results: results,
            aggregations: aggregations,
            pagesToLinkTo: pagesToLinkTo,
            currentPage: currentPage,
            prev: prev,
            next: next,
            filters: filters,
            totalResults: totalResults,
            startingAtItem: startingAtItem,
            endingAtItem: endingAtItem,
            action: 'staleIssues'
        }" />
    </form>
</f:section>
