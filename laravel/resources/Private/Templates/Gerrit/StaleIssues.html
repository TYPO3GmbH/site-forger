<f:layout name="Default" />

<f:section name="Title">Stale issues</f:section>
<f:section name="Javascripts">
</f:section>

<f:section name="Content">
    <h1>Stale issues</h1>
    <f:if condition="{issues}">
        <f:then>
            <div class="alert alert-warning" role="alert">
                <strong>Stale issues found!</strong> Oops, I have found <f:count>{issues}</f:count> stale issues
            </div>
            <table class="table table-striped table-bordered">
                <tr>
                    <th>Link</th>
                    <th>Title</th>
                </tr>
                <f:for each="{issues}" as="issue">
                    <tr>
                        <td>{issue.id}</td>
                        <td><a href="https://forge.typo3.org/issues/{issue.id}" target="_blank">{issue.subject}</a></td>
                    </tr>
                </f:for>
            </table>
        </f:then>
        <f:else>
            <div class="alert alert-success" role="alert">
                <strong>No stale issues!</strong> Good job, I couldn't find any stale issue!
            </div>
        </f:else>
    </f:if>
</f:section>
