<f:layout name="Default" />

<f:section name="Title">Register</f:section>
<f:section name="Javascripts"></f:section>

<f:section name="Content">
	<h1>Registration</h1>

	<fl:flashMessages />

	<fl:form action="create" controller="Login" method="post" name="loginform">
		<label>User:</label><fl:form.textfield name="name" /><br />
		<label>Pass:</label><fl:form.password name="pass" /><br />
		<label>Pass repeat:</label><fl:form.password name="pass2" /><br />
		<fl:form.submit value="Login" />
	</fl:form>

</f:section>
