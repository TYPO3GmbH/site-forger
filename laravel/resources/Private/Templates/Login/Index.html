<f:layout name="Default" />

<f:section name="Title">Login</f:section>
<f:section name="Javascripts"></f:section>

<f:section name="Content">
	<h1>Login</h1>

	<fl:flashMessages />

	<f:security.ifHasRole role="BoardAdmin">
		<f:then>
			<fl:link.action action="logout" controller="Login">Logout</fl:link.action>
		</f:then>
		<f:else>
			<fl:form action="authenticate" method="post" name="loginform" class="loginform">
				<label>User:</label><fl:form.textfield name="__authentication[TYPO3][Flow][Security][Authentication][Token][UsernamePassword][username]" /><br />
				<label>Pass:</label><fl:form.password name="__authentication[TYPO3][Flow][Security][Authentication][Token][UsernamePassword][password]" /><br />
				<fl:form.submit value="Login" />
			</fl:form>
		</f:else>
	</f:security.ifHasRole>


</f:section>
