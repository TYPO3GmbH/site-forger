<f:layout name="Default"/>

<f:section name="Title">ReviewSprint View</f:section>
<f:section name="Javascripts">
</f:section>

<f:section name="Content">
	<div class="row">
		<div class="col-xs-12">
			<div class="btn-group">
				<f:for each="{boardMenu}" as="boardNav">
					<fl:link.action
							class="btn btn-default {f:if(condition: boardNav.active, then: 'active')}"
							controller="ReviewSprint"
							action="Index"
							arguments="{boardId:boardNav.id}"
							>{boardNav.name} ({boardNav.count})</fl:link.action>
				</f:for>
			</div>
			<p>&nbsp;</p>
		</div>
	</div>
	<f:if condition="{board}">
		<f:then></f:then>
		<f:else>
			<div class="row mt20">
				<div class="col-xs-12">
					<div class="alert alert-info" role="alert">
						<strong>No Sprint selected!</strong> Please select a sprint!
					</div>
				</div>
			</div>
		</f:else>
	</f:if>
    <f:if condition="{board}">
        <div class="row board">
            <f:for each="{board}" as="cards" key="metacolname">
                <div class="col-md-2 col-sm-2 boardcolumn" id="column-{metacolname}">
	                <f:switch expression="{metacolname}">
		                <f:case value="missesBoth">
			                <h3 class="status_new"><strong><f:count subject="{cards}"/></strong> Unchecked</h3>
		                </f:case>
		                <f:case value="missesCodeReview">
			                <h3 class="status_new"><strong><f:count subject="{cards}"/></strong> Misses Code Review</h3>
		                </f:case>
		                <f:case value="missesTesting">
			                <h3 class="status_new"><strong><f:count subject="{cards}"/></strong> Misses Testing</h3>
		                </f:case>
		                <f:case value="hasPlusOne">
		                <h3 class="status_new"><strong><f:count subject="{cards}"/></strong> Has Votes</h3>
		                </f:case>
		                <f:case value="hasPlusTwo">
			                <h3 class="status_new"><strong><f:count subject="{cards}"/></strong> Can be merged</h3>
		                </f:case>
		                <f:case value="blocked">
			                <h3 class="status_feedback"><strong><f:count subject="{cards}"/></strong> Blocked</h3>
		                </f:case>
	                </f:switch>
                    <div class="cards">
                    <f:for each="{cards}" as="card">
                        <f:render partial="ReviewCard" arguments="{card: card, coltype: metacolname}"/>
                    </f:for>
                    </div>
                </div>
            </f:for>
        </div>
    </f:if>
</f:section>
