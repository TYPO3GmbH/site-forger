id:
  type: integer
change_id:
  type: keyword
reviewstatus:
  type: keyword
subject:
  type: text
branch:
  type: keyword
topic:
  type: keyword
releases:
  type: keyword
mergeable:
  type: keyword
reviewtags:
  type: keyword
affected_files:
  type: integer
insertions:
  type: integer
deletions:
  type: integer
positive_reviews:
  type: integer
negative_reviews:
  type: integer
positive_verifications:
  type: integer
negative_verifications:
  type: integer
lowest_review_vote:
  type: integer
highest_review_vote:
  type: integer
lowest_verification_vote:
  type: integer
highest_verification_vote:
  type: integer
patchsets:
  type: integer
created_on:
  type: date
  format: yyyy/MM/dd HH:mm:ss
updated_on:
  type: date
  format: yyyy/MM/dd HH:mm:ss
owner:
  type: keyword
owner_id:
  type: integer
owner_username:
  type: keyword
ownerEmail:
  type: keyword
files:
  type: keyword
work_in_progress:
  type: boolean
# The commit message of the current patch set, its text without subject and trailers for the search, and the
# Forge issues of its trailers "Resolves:" and "Related:", see App\Document\CommitMessage. Elasticsearch has no
# array type, every field takes several values: "resolves", "related", "releases" and "files" are lists.
commit_message:
  type: text
commit_text:
  type: text
resolves:
  type: integer
related:
  type: integer
# The version of the import that wrote the document, see App\Import\ImportSchema
import_schema:
  type: integer
