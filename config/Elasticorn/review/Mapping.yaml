id:
  type: integer
change_id:
  type: keyword
reviewstatus:
  type: keyword
subject:
  type: text
branch:
  type: keyword
topic:
  type: keyword
releases:
  type: keyword
mergeable:
  type: keyword
reviewtags:
  type: keyword
affected_files:
  type: integer
insertions:
  type: integer
deletions:
  type: integer
positive_reviews:
  type: integer
negative_reviews:
  type: integer
positive_verifications:
  type: integer
negative_verifications:
  type: integer
lowest_review_vote:
  type: integer
highest_review_vote:
  type: integer
lowest_verification_vote:
  type: integer
highest_verification_vote:
  type: integer
patchsets:
  type: integer
created_on:
  type: date
  format: yyyy/MM/dd HH:mm:ss
updated_on:
  type: date
  format: yyyy/MM/dd HH:mm:ss
submitted:
  type: date
  format: yyyy/MM/dd HH:mm:ss
closed_on:
  type: date
  format: yyyy/MM/dd HH:mm:ss
owner:
  type: keyword
  fields:
    folded:
      type: keyword
      normalizer: folded
owner_id:
  type: integer
owner_username:
  type: keyword
ownerEmail:
  type: keyword
files:
  type: keyword
work_in_progress:
  type: boolean
# The commit message of the current patch set, its text without subject and trailers for the search, and the
# Forge issues of its trailers "Resolves:" and "Related:", see App\Document\CommitMessage. Elasticsearch has no
# array type, every field takes several values: "resolves", "related", "releases" and "files" are lists.
commit_message:
  type: text
commit_text:
  type: text
resolves:
  type: integer
related:
  type: integer
# The accounts on Gerrit that voted on the current patch set, see App\Import\GerritChangeImporter::voters(): My Work
# lists the changes a user did not vote on yet
voters:
  type: integer
# The version of the import that wrote the document, see App\Import\ImportSchema
import_schema:
  type: integer
# The review log, the single votes, the files with their lines and the chain are read with a change, never searched
messages:
  type: object
  enabled: false
votes:
  type: object
  enabled: false
file_details:
  type: object
  enabled: false
# The relation chain of an open change, the top first, see GerritChangeImporter::chain()
chain:
  type: object
  enabled: false
# The open changes that conflict with an open change, see GerritChangeImporter::mergeConflicts(). Searched for the
# changes to load again when one of them changes, see App\Search\AffectedChangesQuery
merge_conflicts:
  type: integer
# The comments on the code and on the patch sets, see GerritChangeImporter::comments()
comments:
  type: object
  enabled: false
# What each label lacks for a merge, by the name of the label: OK, NEED, REJECT, IMPOSSIBLE or MAY
label_states:
  properties:
    Code-Review:
      type: keyword
    Verified:
      type: keyword
conflicts:
  type: keyword
cherry_pick_of:
  type: integer
comment_count:
  type: integer
unresolved_comment_count:
  type: integer
# Which version of App\Stream\StreamEvents wrote the events of the document, see App\Stream\StreamSchema
stream_schema:
  type: integer
