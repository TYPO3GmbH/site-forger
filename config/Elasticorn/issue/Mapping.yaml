project:
  properties:
    name:
      type: keyword
tracker:
  properties:
    name:
      type: keyword
status:
  properties:
    name:
      type: keyword
priority:
  properties:
    name:
      type: keyword
fixed_version:
  properties:
    name:
      type: keyword
author:
  properties:
    name:
      type: keyword
      fields:
        folded:
          type: keyword
          normalizer: folded
        # For the search words, see IssueSearch::SEARCHED_FIELDS
        text:
          type: text
    email:
      type: keyword
# Mapped as Elasticsearch would map it by itself, with the folded name for the search
assigned_to:
  properties:
    name:
      type: text
      fields:
        keyword:
          type: keyword
          ignore_above: 256
        folded:
          type: keyword
          normalizer: folded
category:
  properties:
    name:
      type: keyword
focus:
  properties:
    name:
      type: keyword
start_date:
  type: date
  format: yyyy/MM/dd
created_on:
  type: date
  format: yyyy/MM/dd HH:mm:ss
updated_on:
  type: date
  format: yyyy/MM/dd HH:mm:ss
# Set by Forge in ISO 8601 when an issue first closes, see ClosedPerYearQuery::CLOSED_ON
closed_on:
  type: date
complexity:
  type: keyword
typo3_version:
  type: keyword
php_version:
  type: keyword
target_version:
  type: keyword
isregression:
  type: boolean
tags:
  type: keyword
# The text the duplicates page compares. IndexSetup replaces the analyzer by the one named like the language,
# IndexConfiguration.yaml defines it: English stop words and stems, without the Textile markup of Forge.
subject:
  type: text
  analyzer: english
description:
  type: text
  analyzer: english
# The other relations of Forge, each with its type seen from this issue, see App\Enum\IssueRelationEnum
issue_relations:
  properties:
    type:
      type: keyword
    issue:
      type: integer
# The files of the issue, see ForgeIssueImporter::attachments(). Kept for the pages and the API, not searched.
attachments:
  type: object
  enabled: false
# The issue this one is a subtask of, as Forge sends it. Its subtasks are the issues with its number here.
parent:
  properties:
    id:
      type: integer
# The issues this one duplicates and those that duplicate it, from the relations of Forge
duplicates:
  type: integer
duplicated_by:
  type: integer
# The version of the import that wrote the document, see App\Import\ImportSchema
import_schema:
  type: integer
# Which version of App\Stream\StreamEvents wrote the events of the document, see App\Stream\StreamSchema
stream_schema:
  type: integer
