project:
  properties:
    name:
      type: keyword
tracker:
  properties:
    name:
      type: keyword
status:
  properties:
    name:
      type: keyword
priority:
  properties:
    name:
      type: keyword
fixed_version:
  properties:
    name:
      type: keyword
author:
  properties:
    name:
      type: keyword
    email:
      type: keyword
category:
  properties:
    name:
      type: keyword
focus:
  properties:
    name:
      type: keyword
start_date:
  type: date
  format: yyyy/MM/dd
created_on:
  type: date
  format: yyyy/MM/dd HH:mm:ss
updated_on:
  type: date
  format: yyyy/MM/dd HH:mm:ss
complexity:
  type: keyword
typo3_version:
  type: keyword
php_version:
  type: keyword
target_version:
  type: keyword
isregression:
  type: boolean
tags:
  type: keyword
# The text the duplicates page compares. IndexSetup replaces the analyzer by the one named like the language,
# IndexConfiguration.yaml defines it: English stop words and stems, without the Textile markup of Forge.
subject:
  type: text
  analyzer: english
description:
  type: text
  analyzer: english
# The other relations of Forge, each with its type seen from this issue, see App\Enum\IssueRelationEnum
issue_relations:
  properties:
    type:
      type: keyword
    issue:
      type: integer
# The files of the issue, see ForgeIssueImporter::attachments(). Kept for the pages and the API, not searched.
attachments:
  type: object
  enabled: false
# The issue this one is a subtask of, as Forge sends it. Its subtasks are the issues with its number here.
parent:
  properties:
    id:
      type: integer
# The issues this one duplicates and those that duplicate it, from the relations of Forge
duplicates:
  type: integer
duplicated_by:
  type: integer
# The version of the import that wrote the document, see App\Import\ImportSchema
import_schema:
  type: integer
