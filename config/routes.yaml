controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

logout:
  path: /logout

login:
  alias: t3g_keycloak_login

# In dev, "Login" leads to the dev login page, which also offers the Keycloak login
when@dev:
    login:
        alias: dev_login


# The addresses of the lists before they moved below /reviews and /issues, like their menus: links to them may
# exist. Each leads to the new address for good, with its query.
legacy_reviews_ready:
    path: /gerrit/status
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
    defaults: { route: reviews_ready, permanent: true, keepQueryParams: true }
legacy_reviews_verified:
    path: /gerrit/merge-ready
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
    defaults: { route: reviews_verified, permanent: true, keepQueryParams: true }
