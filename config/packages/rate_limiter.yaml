# The state is in the cache, so all processes share it. Each API has its own bucket, keyed by its name.
framework:
    rate_limiter:
        api:
            policy: token_bucket
            limit: 10
            rate: { interval: '1 second', amount: 10 }
        # The public API at /api/v1, a bucket for each client address, see ApiRateLimitSubscriber
        public_api:
            policy: token_bucket
            limit: 120
            rate: { interval: '1 minute', amount: 120 }
