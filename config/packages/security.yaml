security:
    providers:
      keycloak:
        id: keycloak.typo3.com.user.provider
    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: keycloak
            logout:
                path: /logout
            custom_authenticators:
                - T3G\Bundle\Keycloak\Security\KeyCloakAuthenticator

    role_hierarchy:
      ROLE_CORE_COMPONENT: ROLE_USER
      ROLE_CORE_FRAMEWORK: ROLE_CORE_COMPONENT
      ROLE_ADMIN: ROLE_CORE_FRAMEWORK

# Second login in dev: log in as one of these fixed users at /_dev/login (keys are the user identifiers).
# Keycloak login keeps working next to it. ROLE_USER is always added.
# "email" is optional (default: <identifier>@forger.ddev.site); set it to see the issues and
# Gerrit changes of that address on "My Work".
when@dev:
    parameters:
        app.dev_login.users:
            dev-admin: { name: 'Dev Admin', roles: ['ROLE_ADMIN'] }
            dev-framework: { name: 'Dev Core Framework', roles: ['ROLE_CORE_FRAMEWORK'] }
            dev-component: { name: 'Dev Core Component', roles: ['ROLE_CORE_COMPONENT'] }
            dev-user: { name: 'Dev User', roles: ['ROLE_USER'] }

    security:
        firewalls:
            main:
                entry_point: App\Security\Dev\DevLoginAuthenticator
                custom_authenticators:
                    - App\Security\Dev\DevLoginAuthenticator

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
