security:
    providers:
      keycloak:
        id: keycloak.typo3.com.user.provider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
          anonymous: true
          logout:
              path: /logout
              success_handler: App\Security\LogoutSuccessHandler
          guard:
              authenticators:
                - T3G\Bundle\Keycloak\Security\KeyCloakAuthenticator

    access_control:
        - { path: ^/login$, role: IS_AUTHENTICATED_ANONYMOUSLY }

    role_hierarchy:
      ROLE_CORE_COMPONENT: ROLE_USER
      ROLE_CORE_FRAMEWORK: ROLE_CORE_COMPONENT
      ROLE_ADMIN: ROLE_CORE_FRAMEWORK
