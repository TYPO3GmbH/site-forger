# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    redmine_project_id: 27
    elastic_index_name: '%env(ELASTIC_INDEX)%'
    'StatusMapping':
      'Rejected': 'Done'
      'Closed': 'Done'
      'Resolved': 'Done'
      'Under Review': 'Review'
      'In Progress': 'WIP'
      'On Hold': 'BLOCKED'
      'Needs Feedback': 'BLOCKED'
      'DefaultState': 'Open'
    'ColumnOrder':
      'BLOCKED':
      'Open':
      'WIP':
      'Review':
      'Done':
    karmaPoints:
      core:review:comment: 1
      core:review:codereview: 3
      core:review:testing: 5
      core:review:patchset: 2
      core:review:merge: 10
      core:review:merge-lastpatchset: 10
      core:review:merge-author: 10
      core:review:abandon: 3
      github:typo3-documentation:issue:closed: 3
      github:typo3-documentation:pr:merged: 10
      github:typo3-documentation:pullrequestreviewcomment:created: 3
      github:typo3-documentation:pullrequestreview:created: 5
      github:typo3-documentation:push:generic: 10
      github:typo3-documentation:issuecomment:created: 1
      github:typo3-documentation:pullrequest:opened: 15
      github:friendsoftypo3:issue:closed: 3
      github:friendsoftypo3:pr:merged: 10
      github:friendsoftypo3:pullrequestreviewcomment:created: 3
      github:friendsoftypo3:pullrequestreview:created: 5
      github:friendsoftypo3:push:generic: 5
      github:friendsoftypo3:issuecomment:created: 1
      github:friendsoftypo3:pullrequest:opened: 15
      github:typo3:issue:closed: 3
      github:typo3:pr:merged: 10
      github:typo3:pullrequestreviewcomment:created: 3
      github:typo3:pullrequestreview:created: 5
      github:typo3:push:generic: 5
      github:typo3:issuecomment:created: 1
      github:typo3:pullrequest:opened: 10


services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        #bind:
        #  $elastic_index_name: '%env(ELASTIC_INDEX)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/*'
        exclude: '../src/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}'

    # controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']
    App\Client\ForgeClient:
        class: App\Client\ForgeClient
        public: true
        arguments:
            $url: '%env(FORGE_ENDPOINT)%'
            $apikeyOrUsername: '%env(FORGE_ACCESS_TOKEN)%'
    App\Client\GeneralClient:
        class: App\Client\GeneralClient
        public: true
    App\Client\ElasticClient:
        class: App\Client\ElasticClient
        public: true
        arguments:
            $config:
                  host: '%env(ELASTIC_HOST)%'
                  port: '%env(ELASTIC_PORT)%'
                  path: '%env(ELASTIC_PATH)%'
                  transport: '%env(ELASTIC_TRANSPORT)%'
                  index: '%env(ELASTIC_INDEX)%'
                  username: '%env(ELASTIC_AUTH_USERNAME)%'
                  password: '%env(ELASTIC_AUTH_PASSWORD)%'
    App\Client\GithubClient:
        class: App\Client\GithubClient
        arguments:
          $config:
            base_uri: 'https://api.github.com/'
            auth:
              - '%env(GITHUB_USERNAME)%'
              - '%env(GITHUB_ACCESS_TOKEN)%'
    App\Service\DiscordService:
        class: App\Service\DiscordService
        public: true
    App\Command\ImportCommand:
        class: App\Command\ImportCommand
        public: true
        arguments:
            $discordWebhook: '%env(DISCORD_ISSUES_WEBHOOK)%'
    #        tags:
    #            - testDouble
    App\Menu\MenuBuilder:
        tags:
            - name: 'knp_menu.menu_builder'
              method: 'mainDefault'
              alias: 'main-default'
            - name: 'knp_menu.menu_builder'
              method: 'mainProfile'
              alias: 'main-profile'
            - name: 'knp_menu.menu_builder'
              method: 'mainFooter'
              alias: 'main-footer'

    App\Security\LogoutSuccessHandler:
      class: App\Security\LogoutSuccessHandler
      arguments:
        $appUrl: '%env(APP_URL)%'
