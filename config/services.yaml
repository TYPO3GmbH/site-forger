# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  router.request_context.host: '%env(APP_URL)%'
  router.request_context.scheme: 'https'
  redmine_project_id: 27
  # The releases whose backports the backport view watches
  backport_releases: ['13.4', '14.3']

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
    bind:
      App\Http\ApiClient $forge: '@api.forge'
      App\Http\ApiClient $forgePublic: '@api.forge.public'
      App\Http\ApiClient $gerrit: '@api.gerrit'

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'

  # dotenv:dump compiles .env and .env.local into .env.local.php in a deployment (forger:dump_env in deploy.php),
  # without Composer and its plugins on the server
  Symfony\Component\Dotenv\Command\DotenvDumpCommand: ~

  # Built from the ES_* settings, see App\Elastic\ClientFactory. 300 seconds for a request, as Elastica 7 had it.
  Elastica\Client:
    factory: ['App\Elastic\ClientFactory', 'create']
    arguments:
      $host: '%env(ES_HOST)%'
      $port: '%env(ES_PORT)%'
      $path: '%env(ES_PATH)%'
      $transport: '%env(ES_TRANSPORT)%'
      $user: '%env(ES_USER)%'
      $password: '%env(ES_PASSWORD)%'
      $timeout: 300

  # The same Elasticsearch with short timeouts, for App\Elastic\Availability: a server that does not answer costs
  # seconds there, not the timeout of a search
  app.elasticsearch.ping_client:
    class: Elastica\Client
    factory: ['App\Elastic\ClientFactory', 'create']
    arguments:
      $host: '%env(ES_HOST)%'
      $port: '%env(ES_PORT)%'
      $path: '%env(ES_PATH)%'
      $transport: '%env(ES_TRANSPORT)%'
      $user: '%env(ES_USER)%'
      $password: '%env(ES_PASSWORD)%'
      $timeout: 3
      $connectTimeout: 2

  # To add an API, add a service here and a bind in _defaults.
  api.forge:
    class: App\Http\ApiClient
    arguments:
      $name: 'Forge'
      $client: !service
        class: GuzzleHttp\Client
        arguments:
          - base_uri: '%env(FORGE_ENDPOINT)%'
            connect_timeout: 10
            timeout: 120
            headers:
              X-Redmine-API-Key: '%env(FORGE_ACCESS_TOKEN)%'
              # forge.typo3.org rejects requests without a User-Agent (bot protection)
              User-Agent: 'TYPO3 Forger'
      $rateLimiter: '@limiter.forge'
      # Stephan Großberndt asked for 50 to 100 ms between two requests (Slack #t3a-t3g-infra, 2024-04-15).
      # With 50 ms Forge answered 429 to a run that loads one issue per request, and the run waited most of its time.
      # The pause spreads the requests. The bucket of limiter.forge keeps their number below the limit of Forge.
      $minPauseMs: 600

  # Temporary: the issues as the public sees them, while the token may not view them. See ForgeIssueApi.
  api.forge.public:
    class: App\Http\ApiClient
    arguments:
      $name: 'Forge'
      $client: !service
        class: GuzzleHttp\Client
        arguments:
          - base_uri: '%env(FORGE_ENDPOINT)%'
            connect_timeout: 10
            timeout: 120
            headers:
              # forge.typo3.org rejects requests without a User-Agent (bot protection)
              User-Agent: 'TYPO3 Forger'
      $rateLimiter: '@limiter.forge'
      # The pause of api.forge
      $minPauseMs: 600

  api.gerrit:
    class: App\Http\ApiClient
    arguments:
      $name: 'Gerrit'
      $client: !service
        class: GuzzleHttp\Client
        arguments:
          - base_uri: 'https://review.typo3.org/'
            connect_timeout: 10
            timeout: 120
            headers:
              User-Agent: 'TYPO3 Forger'
      $rateLimiter: '@limiter.api'
      # The same hosting as Forge, where 50 to 100 ms between two requests were asked for, see api.forge. Gerrit
      # sends 25 changes per request, so the pause costs a run little.
      $minPauseMs: 100

  renderer.redmineTextile:
    class: App\Renderer\RedmineTextileRenderer
    factory: '@App\Renderer\Factory\RedmineTextileRendererFactory'

  # controllers are imported separately to make sure services can be injected
  # as action arguments even if you don't extend any base controller class
  App\Controller\:
    resource: '../src/Controller'
    tags: ['controller.service_arguments']


  # The state of the schedule (App\Scheduler\JobSchedule): in var/scheduler, which the deployments keep,
  # unlike var/cache
  app.scheduler.state:
    class: Symfony\Component\Cache\Adapter\FilesystemAdapter
    arguments: ['jobs', 0, '%kernel.project_dir%/var/scheduler']

  # The state of the imports that is not in the index (App\Import\ImportState): in var/scheduler too
  app.import.state:
    class: Symfony\Component\Cache\Adapter\FilesystemAdapter
    arguments: ['import', 0, '%kernel.project_dir%/var/scheduler']

  # The signal of messenger:stop-workers in var/scheduler too: each release has its own var/cache, and the worker of
  # the release before has to read the signal of the new one, see forger:worker_restart in deploy.php
  cache.messenger.restart_workers_signal:
    class: Symfony\Component\Cache\Adapter\FilesystemAdapter
    arguments: ['restart_workers', 0, '%kernel.project_dir%/var/scheduler']

  App\Menu\Breadcrumb:
    arguments:
      $helper: '@knp_menu.helper'

  App\Menu\MenuBuilder:
    tags:
      - name: 'knp_menu.menu_builder'
        method: 'mainDefault'
        alias: 'main-default'
      - name: 'knp_menu.menu_builder'
        method: 'mainProfile'
        alias: 'main-profile'
      - name: 'knp_menu.menu_builder'
        method: 'mainFooter'
        alias: 'main-footer'

  # The subscriber of the Keycloak bundle, without the stateless routes of the public API
  T3G\Bundle\Keycloak\EventSubscriber\RequestSubscriber:
    class: App\Security\StatelessAwareKeycloakSubscriber

  App\Security\LogoutSuccessHandler:
    class: App\Security\LogoutSuccessHandler
    arguments:
      $openIdService: '@T3G\Bundle\Keycloak\Service\OpenIdService'
      $keycloakBaseUri: '%env(KEYCLOAK_BASE_URI)%'
      $keycloakRealm: '%env(KEYCLOAK_REALM)%'
      $keycloakClientId: '%env(KEYCLOAK_CLIENT_ID)%'
      $appUrl: '%env(APP_URL)%'

  App\Renderer\Factory\RedmineTextileRendererFactory: ~


  App\Subscriber\HostAwareRouteSubscriber:
    class: App\Subscriber\HostAwareRouteSubscriber
    arguments:
      - '@router'
      - '%env(APP_URL)%'
    tags:
      - { name: kernel.event_subscriber }
