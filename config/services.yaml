# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  router.request_context.host: '%env(APP_URL)%'
  router.request_context.scheme: 'https'
  redmine_project_id: 27
  'StatusMapping':
    'Rejected': 'Done'
    'Closed': 'Done'
    'Resolved': 'Done'
    'Under Review': 'Review'
    'In Progress': 'WIP'
    'On Hold': 'BLOCKED'
    'Needs Feedback': 'BLOCKED'
    'DefaultState': 'Open'
  'ColumnOrder':
    'BLOCKED':
    'Open':
    'WIP':
    'Review':
    'Done':
  karmaPoints:
    core:review:comment: 1
    core:review:codereview: 3
    core:review:testing: 5
    core:review:patchset: 2
    core:review:merge: 10
    core:review:merge-lastpatchset: 10
    core:review:merge-author: 10
    core:review:abandon: 3

    # GitHub Contribution
    # Due to negative feedback from the community
    # the following committee adjusted the values
    # reasoning is noted.
    #
    # - Oliver Hader
    # - Benjamin Franzke
    # - Benjamin Kott
    # - Andreas Kienast
    #
    # pullrequestreviewcomment:
    # is triggered for each and every comment
    # mapping -> core:review:comment
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request_review_comment
    #
    # pullrequestreview:
    # is triggered when a code review is submitted
    # mapping -> core:review:codereview
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request_review
    #
    # push:generic:
    # is triggered when ever a commit or tag is pushed
    # mapping -> core:review:patchset
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#push
    #
    # pullrequest:opened:
    # is triggered when ever a pull request is opened
    # we currently do not track merges of pull request
    # mapping: -> core:review:merge-author
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request
    github:typo3-documentation:issue:closed: 1
    github:typo3-documentation:pr:merged: 10
    github:typo3-documentation:pullrequestreviewcomment:created: 1
    github:typo3-documentation:pullrequestreview:created: 3
    github:typo3-documentation:push:generic: 2
    github:typo3-documentation:issuecomment:created: 1
    github:typo3-documentation:pullrequest:opened: 10
    github:friendsoftypo3:issue:closed: 1
    github:friendsoftypo3:pr:merged: 10
    github:friendsoftypo3:pullrequestreviewcomment:created: 1
    github:friendsoftypo3:pullrequestreview:created: 3
    github:friendsoftypo3:push:generic: 2
    github:friendsoftypo3:issuecomment:created: 1
    github:friendsoftypo3:pullrequest:opened: 10
    github:typo3:issue:closed: 1
    github:typo3:pr:merged: 10
    github:typo3:pullrequestreviewcomment:created: 1
    github:typo3:pullrequestreview:created: 3
    github:typo3:push:generic: 2
    github:typo3:issuecomment:created: 1
    github:typo3:pullrequest:opened: 10

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'

  redmine.client.forge:
    class: Redmine\Client\NativeCurlClient
    arguments:
      $url: '%env(FORGE_ENDPOINT)%'
      $apikeyOrUsername: '%env(FORGE_ACCESS_TOKEN)%'

  guzzle.client.general:
    class: GuzzleHttp\Client

  guzzle.client.gerrit:
    class: GuzzleHttp\Client
    arguments:
      $config:
        base_uri: 'https://review.typo3.org/'

  guzzle.client.github:
    class: GuzzleHttp\Client
    arguments:
      $config:
        headers:
          User-Agent: 'TYPO3 Forger'
          Authorization: 'token %env(GITHUB_ACCESS_TOKEN)%'
        base_uri: 'https://api.github.com/'

  renderer.redmineTextile:
    class: App\Renderer\RedmineTextileRenderer
    factory: '@App\Renderer\Factory\RedmineTextileRendererFactory'

  App\Charts\Types\TrackerTypes:
    class: App\Charts\Types\TrackerTypes
    tags:
      - { name: 'chart_type', key: 'tracker_types' }

  # controllers are imported separately to make sure services can be injected
  # as action arguments even if you don't extend any base controller class
  App\Controller\:
    resource: '../src/Controller'
    tags: ['controller.service_arguments']

  App\Command\ImportCommand:
    class: App\Command\ImportCommand
    public: true
    arguments:
      $forgeClient: '@redmine.client.forge'
      $client: '@guzzle.client.gerrit'

  App\Menu\MenuBuilder:
    tags:
      - name: 'knp_menu.menu_builder'
        method: 'mainDefault'
        alias: 'main-default'
      - name: 'knp_menu.menu_builder'
        method: 'mainProfile'
        alias: 'main-profile'
      - name: 'knp_menu.menu_builder'
        method: 'mainFooter'
        alias: 'main-footer'

  App\Security\LogoutSuccessHandler:
    class: App\Security\LogoutSuccessHandler
    arguments:
      $urlService: '@datahub.typo3.com.urlService'
      $appUrl: '%env(APP_URL)%'

  App\Renderer\Factory\RedmineTextileRendererFactory: ~

  App\Service\GithubService:
    class: App\Service\GithubService
    arguments:
      $client: '@guzzle.client.github'

  App\Subscriber\HostAwareRouteSubscriber:
    class: App\Subscriber\HostAwareRouteSubscriber
    arguments:
      - '@router'
      - '%env(APP_URL)%'
    tags:
      - { name: kernel.event_subscriber }
