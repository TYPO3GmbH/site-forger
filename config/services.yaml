# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    redmine_project_id: 27
    elastic_index_name: '%env(ELASTIC_INDEX)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/*'
        exclude: '../src/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}'

    # controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']
    App\Client\ForgeClient:
        class: App\Client\ForgeClient
        public: true
        arguments:
            $url: '%env(FORGE_ENDPOINT)%'
            $apikeyOrUsername: '%env(FORGE_ACCESS_TOKEN)%'
    App\Client\ElasticClient:
        class: App\Client\ElasticClient
        public: true
        arguments:
            $config:
                  host: '%env(ELASTIC_HOST)%'
                  port: '%env(ELASTIC_PORT)%'
                  path: '%env(ELASTIC_PATH)%'
                  transport: '%env(ELASTIC_TRANSPORT)%'
                  index: '%env(ELASTIC_INDEX)%'
                  username: '%env(ELASTIC_AUTH_USERNAME)%'
                  password: '%env(ELASTIC_AUTH_PASSWORD)%'
    #        tags:
    #            - testDouble
    App\Menu\MenuBuilder:
        tags:
            - name: 'knp_menu.menu_builder'
              method: 'mainDefault'
              alias: 'main-default'
            - name: 'knp_menu.menu_builder'
              method: 'mainProfile'
              alias: 'main-profile'
            - name: 'knp_menu.menu_builder'
              method: 'mainFooter'
              alias: 'main-footer'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # LDAP connection for user authentication
    Symfony\Component\Ldap\Ldap:
      arguments: ['@Symfony\Component\Ldap\Adapter\ExtLdap\Adapter']
    Symfony\Component\Ldap\Adapter\ExtLdap\Adapter:
      arguments:
        - host: ldap.typo3.org
          port: 636
          encryption: ssl
          options:
            protocol_version: 3
            referrals: false

  # Our custom user provider to ldap.typo3.org
    ldap.typo3.org.user.provider:
      class: App\Security\LdapUserProvider
      arguments:
        $ldap: '@Symfony\Component\Ldap\Ldap'
        $baseDn: 'ou=people,dc=typo3,dc=org'
        $searchDn: '%env(LDAP_SEARCH_USER)%'
        $searchPassword: '%env(LDAP_SEARCH_PASSWORD)%'
        $defaultRoles: [ 'ROLE_USER' ]
